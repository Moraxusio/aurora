name: aurora_tls
description: TLS 1.3 client with certificate pinning, on BoringSSL, over a plain dart:io socket. Built by a build hook for every target.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.7

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
