name: aurora
description: Aurora 3 client (docs/DESIGN.md D-70).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  aurora_install:
    path: packages/aurora_install
  aurora_profile:
    path: packages/aurora_profile
  aurora_sub:
    path: packages/aurora_sub
  aurora_tls:
    path: packages/aurora_tls
  aurora_wire:
    path: packages/aurora_wire
  file_picker: 13.3.2
  # Code editor for the file tabs (MIT), with its highlighter (MIT).
  re_editor: 0.10.0
  re_highlight: 0.0.3
  # xterm 4.0.0 (MIT) with a patch for Flutter's Windows text input; see
  # third_party/xterm/AURORA.md.
  xterm:
    path: third_party/xterm
  flutter_markdown_plus: ^1.0.12
  pdfrx: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/aurora3-256.png
    # Android only: the signed agent, copied here by tools/package-android.ps1
    # (not committed) and unpacked at first start. Desktop builds from a clean
    # checkout carry only the placeholders.
    - assets/agent/
    - assets/agent/amd64/
    # Android only: LICENSE, NOTICE and the third-party list, copied here by
    # tools/package-android.ps1 (not committed); Windows ships them as files.
    - assets/legal/
